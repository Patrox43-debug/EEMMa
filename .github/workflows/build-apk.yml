name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK with Gradle
        working-directory: ./android-app
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename and Prepare APK
        run: |
          VERSION=$(grep 'versionName' android-app/app/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION="1.6.0"; fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "EEMM_v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EEMM_v${{ env.APP_VERSION }}_APK
          path: EEMM_v*.apk
